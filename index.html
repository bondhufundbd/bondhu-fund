async function compactImage(file,maxSize=256,maxBytes=65000){if(!file||file.size>15*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error(t('photoError'));let url=URL.createObjectURL(file);try{let image=new Image();await new Promise((res,rej)=>{image.onload=res;image.onerror=rej;image.src=url});const factor=Math.min(1,maxSize/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*factor));canvas.height=Math.max(1,Math.round(image.height*factor));let ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);let quality=.82,out=canvas.toDataURL('image/jpeg',quality);while(out.length>maxBytes&&quality>.25){quality-=.1;out=canvas.toDataURL('image/jpeg',quality)}if(out.length>maxBytes)throw new Error(t('photoError'));return out}finally{URL.revokeObjectURL(url)}}

ual')})</label><input id="newRate" type="number" min="0.000001" step="any"></div></div><div class="spacer"></div><button class="primary">+ ${t('currencyAdd')}</button></form><p class="mini spaced">${lang==='bn'?'স্বয়ংক্রিয় হার থাকলে ম্যানুয়াল ঘর খালি রাখুন।':'Leave the manual field empty to use available automatic rates.'}<br>${t('rateAuto')}: ${Object.keys(fxCache?.rates||{}).length} ${t('currency')} · ${t('rateManual')} ${t('save')}</p></div>`:''}`}
function updateConverter(){let value=Number($('convertAmount').value),from=$('convertFrom').value,to=$('convertTo').value,a=rateFor(from),b=rateFor(to);$('converted').textContent=a&&b&&value>=0?n(value/a*b)+' '+to:t('rateUnavailable')}
async function refreshRates(show=false){if(fxCache?.provider==='currency-api'&&Date.now()-fxCache.fetchedAt<3600000)return;for(const endpoint of ['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/sar.json','https://latest.currency-api.pages.dev/v1/currencies/sar.json']){try{const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);let res;try{res=await fetch(endpoint,{signal:ctl.signal,referrerPolicy:'no-referrer'})}finally{clearTimeout(timer)}if(!res.ok)throw new Error();const j=await res.json();if(!j.sar||j.sar.sar!==1||!Number.isFinite(j.sar.bdt)||j.sar.bdt<=0||!validDate(j.date))throw new Error();fxCache={rates:Object.fromEntries(Object.entries(j.sar).map(([k,v])=>[k.toUpperCase(),v])),time:Date.parse(j.date+'T00:00:00Z')/1000,fetchedAt:Date.now(),provider:'currency-api'};writeLocal('bf-rates',JSON.stringify(fxCache));if(show)toast(t('saved'));if(role&&!$('overlay').innerHTML)render();return}catch{}}if(show)toast(t('rateUnavailable'))}

function errorMessage(err){const code=err?.code||'';if(/auth\/(invalid-credential|user-not-found|wrong-password|invalid-email)/.test(code))return lang==='bn'?'লগইন তথ্য সঠিক নয়।':'Incorrect sign-in details.';if(code==='auth/email-already-in-use')return lang==='bn'?'এই অ্যাকাউন্ট আগে থেকেই আছে।':'This account already exists.';if(code==='auth/too-many-requests')return lang==='bn'?'অনেক চেষ্টা হয়েছে; একটু পরে চেষ্টা করুন।':'Too many attempts. Try again later.';if(code==='auth/unauthorized-domain')return lang==='bn'?'এই হোস্টিং ডোমেইন অনুমোদিত নয়।':'This hosting domain is not authorized.';if(code==='permission-denied')return lang==='bn'?'এই কাজের অনুমতি নেই।':'This action is not permitted.';if(/network|unavailable/.test(code))return t('offline');return err?.message||t('error')}

async function recordPayment(ev){ev.preventDefault();if(role!=='admin')return;const id=$('payMember').value,code=$('payCurrency').value,r=rateFor(code),method=$('payMethod').value,reference=$('payReference').value.trim()||method.toUpperCase()+'-'+Date.now(),cycle=data.cfg.cycle,month=data.cfg.month;if(!data.cfg.started||!data.cfg.roster.includes(id)||data.members.find(m=>m.uid===id)?.isAdmin||!r||!reference||paid(id))return toast(t('error'));await act(async()=>{if(mode==='demo'){let c=data.cfg,f=fee(id);data.payments.push({id:paymentID(month,id),uid:id,cycle,month,base:c.installment,fee:f,date:c.asOf,method,reference,originalCurrency:code,originalAmount:Math.round((c.installment+f)*r)/100,fx:r});c.collected+=c.installment;c.paidCount++;c.paidUids.push(id);saveDemo('Payment recorded: '+id+' / '+month)}else{await fb.f.runTransaction(fb.db,async tx=>{const cr=fb.f.doc(fb.db,'config','circle'),pr=fb.f.doc(fb.db,'payments',`${cycle}_${month}_${id}`);const cs=await tx.get(cr),ps=await tx.get(pr);let c=cs.data();if(ps.exists()||c.cycle!==cycle||c.month!==month||!c.started||!c.roster.includes(id))throw new Error(t('error'));const lateNow=(Date.parse(isoDate()+'T00:00:00Z')-Date.parse(c.due+'T00:00:00Z'))/86400000>c.grace,f=lateNow?Math.round(c.installment*c.rate/100):0;tx.set(pr,{uid:id,cycle,month,base:c.installment,fee:f,date:isoDate(),method,reference,originalCurrency:code,originalAmount:Math.round((c.installment+f)*r)/100,fx:r,actor:uid,at:fb.f.serverTimestamp()});tx.update(cr,{collected:(Number(c.collected)||0)+c.installment,paidCount:(Number(c.paidCount)||0)+1,paidUids:[...(c.paidUids||[]),id]});tx.set(fb.f.doc(fb.f.collection(fb.db,'audit')),{action:'Payment recorded: '+id+' / '+month,date:isoDate(),actor:uid,at:fb.f.serverTimestamp()})})}busy=false;closeModal();render();toast(t('recorded'))})}

async function initFirebase(){if(fb)return fb;if(initPromise)return initPromise;initPromise=(async()=>{const [core,a,f]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js')]);const app=core.initializeApp(FIREBASE_CONFIG);fb={core,a,f,app,auth:a.getAuth(app),db:f.getFirestore(app)};await a.setPersistence(fb.auth,a.browserLocalPersistence);a.onAuthStateChanged(fb.auth,async current=>{if(mode==='demo')return;if(!current){sessionLoading=false;if(mode==='live'){cleanup();role=null;uid=null;user=null;mode=null;render()}else render();return}await attachUser(current)});return fb})();try{return await initPromise}catch(err){initPromise=null;throw err}}
function normalizeDigits(value){return value.replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
async function identifierEmail(id){id=normalizeDigits(id.trim());if(id.toLowerCase()===ADMIN_USERNAME)return ADMIN_AUTH_EMAIL;if(id.includes('@'))return id.toLowerCase();if(!/^[12]\d{9}$/.test(id))throw new Error(lang==='bn'?'১০ অঙ্কের ইকামা নম্বর অথবা সঠিক ইমেইল দিন।':'Enter a 10-digit Iqama number or a valid email.');const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(FIREBASE_CONFIG.projectId+':'+id));return [...new Uint8Array(bytes)].map(b=>b.toString(16).padStart(2,'0')).join('')+'@members.bondhu.invalid'}

function socialIcon(type){return `<img src="${socialPng[type]}" alt="" width="22" height="22" decoding="async">`}
function internationalPhone(v){return normalizeDigits(String(v||'')).replace(/[\s()+-]/g,'').replace(/^00/,'')}
function safeSocial(type,value){try{const u=new URL(value);return u.protocol==='https:'&&({facebook:['facebook.com','www.facebook.com','m.facebook.com','fb.com'],instagram:['instagram.com','www.instagram.com']}[type]||[]).includes(u.hostname)?u.href:''}catch{return ''}}
function contactLink(type){if(type==='whatsapp'){const number=internationalPhone(contactSettings.whatsapp);return /^[1-9]\d{7,14}$/.test(number)?'https://wa.me/'+number:''}return safeSocial(type,contactSettings[type])}
function openContact(type,help=false){const link=contactLink(type);if(!link)return toast(lang==='bn'?'অ্যাডমিন এখনও যোগাযোগের তথ্য দেননি।':'The administrator has not added contact details.');const message=lang==='bn'?'লগে আছি: পাসওয়ার্ড ভুলে গেছি / লগইন করতে সাহায্য চাই।':'Loge Achi: I forgot my password / need sign-in help.';window.open(link+(help?'?text='+encodeURIComponent(message):''),'_blank','noopener,noreferrer')}
function socialLinks(){return `<div class="socialLinks">${['facebook','instagram','whatsapp'].map(type=>`<button class="socialRound" type="button" onclick="openContact('${type}')" aria-label="${type}" title="${type}">${socialIcon(type)}</button>`).join('')}</div>${contactLink('whatsapp')?`<div class="mini center contactNumber">+${e(internationalPhone(contactSettings.whatsapp))}</div>`:''}`}
async function loadContacts(){try{const r=await fetch(DRAW_SERVER+'/contact-settings',{signal:AbortSignal.timeout(12000)});if(!r.ok)return;contactSettings=await r.json();if(!role&&!$('overlay').innerHTML)render()}catch{}}
function contactSettingsCard(){return `<div class="spacer"></div><div class="card"><h2>${lang==='bn'?'যোগাযোগ ও সোশ্যাল মিডিয়া':'Contact and social media'}</h2><p class="mini">${lang==='bn'?'লগইন পেজে সবাই এই তথ্য দেখতে পাবেন।':'These details are public on the sign-in page.'}</p><form onsubmit="saveContacts(event)"><div class="field"><label>WhatsApp (${lang==='bn'?'দেশের কোডসহ':'with country code'})</label><input id="contactWhatsApp" type="tel" placeholder="+966… / +880…" value="${e(contactSettings.whatsapp)}"></div>${['facebook','instagram'].map(k=>`<div class="field"><label>${k==='facebook'?'Facebook':'Instagram'}</label><input id="contact${k}" type="url" placeholder="https://www.${k}.com/…" value="${e(contactSettings[k])}"></div>`).join('')}<button class="primary">${t('save')}</button></form></div>`}
async function saveContacts(ev){ev.preventDefault();if(role!=='admin'||mode!=='live')return;const c={whatsapp:internationalPhone($('contactWhatsApp').value),facebook:$('contactfacebook').value.trim(),instagram:$('contactinstagram').value.trim()};if(c.whatsapp&&!/^[1-9]\d{7,14}$/.test(c.whatsapp))return toast(lang==='bn'?'দেশের কোডসহ সঠিক নম্বর দিন।':'Enter a valid international number.');for(const k of ['facebook','instagram'])if(c[k]&&!safeSocial(k,c[k]))return toast(lang==='bn'?'সঠিক Facebook / Instagram HTTPS লিংক দিন।':'Use a valid Facebook / Instagram HTTPS link.');await act(async()=>{const r=await ledgerCall('/contact-settings',c);contactSettings=r;render();toast(t('saved'))})}
function hasDue(id){return data.cfg.started&&data.cfg.roster.includes(id)&&!paid(id)}
function reminderButton(id){return role==='admin'&&hasDue(id)?`<button class="waButton" type="button" onclick="memberReminder('${e(id)}')">${socialIcon('whatsapp')} ${lang==='bn'?'জরুরি মেসেজ':'Urgent reminder'}</button>`:''}

async function saveTransferBank(ev){ev.preventDefault();if(role!=='admin')return;await act(async()=>{const values=Object.fromEntries(['bank','holder','account','instructions'].map(k=>[k,$('transfer-'+k).value.trim()]));transferBank=await ledgerCall('/bank-settings',values);render();toast(t('saved'))})}
async function copyBankAccount(){try{await navigator.clipboard.writeText(transferBank.account);toast(tr('অ্যাকাউন্ট নম্বর কপি হয়েছে।','Account number copied.'))}catch{toast(tr('অ্যাকাউন্ট নম্বরটি লিখে রাখুন।','Note down the account number.'))}}
function transferModal(){if(role!=='member'||me()?.status!=='approved'||me()?.mustChangePassword)return;if(!transferBank.account||!transferBank.bank||!transferBank.holder)return toast(tr('অ্যাডমিনকে ব্যাংকের তথ্য যোগ করতে বলুন।','Ask the administrator to add bank details.'));requestAttempt=null;const monthly=data.cfg.started&&data.cfg.roster.includes(uid)&&!paid(uid);modal(`<h2>${tr('জমার রসিদ পাঠান','Submit transfer receipt')}</h2><div class="invoice"><b>${e(transferBank.bank)}</b><p>${e(transferBank.holder)}</p><p style="overflow-wrap:anywhere" dir="ltr">${e(transferBank.account)}</p><button type="button" onclick="copyBankAccount()">${tr('নম্বর কপি','Copy account')}</button>${transferBank.instructions?`<p class="mini">${e(transferBank.instructions)}</p>`:''}</div><p class="mini spaced">${tr('নিজের ব্যাংক অ্যাপ থেকে টাকা পাঠিয়ে তারপর রসিদ দিন। এখানে টাকা পাঠানো হয় না।','Transfer using your bank app, then submit the receipt here.')}</p><form onsubmit="submitTransfer(event)"><div class="field"><label>${tr('জমার ধরন','Deposit type')}</label><select id="transferKind" onchange="transferAmount()">${monthly?`<option value="monthly">${tr('মাসিক কিস্তি — মাস ','Monthly contribution — month ')}${n(data.cfg.month)}</option>`:''}<option value="account">${tr('সাধারণ জমা (ড্রয়ের কিস্তি নয়)','General deposit (separate from draw)')}</option></select></div><div class="field"><label>${tr('টাকার পরিমাণ (SAR)','Amount (SAR)')}</label><input id="transferAmount" inputmode="decimal" required maxlength="12"><p id="transferAmountNote" class="mini"></p></div><div class="field"><label>${tr('টাকা পাঠানোর তারিখ','Transfer date')}</label><input id="transferDate" type="date" required value="${isoDate()}" max="${isoDate()}"></div><div class="field"><label>${tr('যে অ্যাকাউন্ট থেকে পাঠিয়েছেন — নাম','Sending account holder name')}</label><input id="transferSenderName" required maxlength="80" autocomplete="name" value="${e(memberName(me()))}"></div><div class="field"><label>${tr('যে অ্যাকাউন্ট থেকে পাঠিয়েছেন — নম্বর / IBAN','Sending account number / IBAN')}</label><input id="transferSenderAccount" required minlength="3" maxlength="50" autocomplete="off" autocapitalize="characters" spellcheck="false" dir="ltr"><p class="mini">${tr('টাকা পাঠানোর রসিদে থাকা অ্যাকাউন্ট নম্বর দিন।','Enter the sending account number shown on your receipt.')}</p></div><div class="field"><label>${tr('ট্রানজেকশন / রেফারেন্স নম্বর','Transaction / reference number')}</label><input id="transferReference" required maxlength="80" autocomplete="off"></div><div class="field"><label>${tr('রসিদের স্ক্রিনশট','Receipt screenshot')}</label><input id="transferReceipt" type="file" accept="image/jpeg,image/png,image/webp" required onchange="previewTransferReceipt(this)"><img id="transferPreview" hidden alt="${tr('রসিদের ছবি','Receipt preview')}" style="max-width:100%;max-height:260px;object-fit:contain;border-radius:12px"></div><div class="field"><label>${tr('নোট (ঐচ্ছিক)','Note (optional)')}</label><input id="transferNote" maxlength="160"></div><p class="mini">${tr('আবেদন অ্যাডমিনের কাছে যাবে। ব্যাংকে টাকা আসা যাচাই করে কনফার্ম করার পর আপনার হিসাবে ও হিস্ট্রিতে জমা হবে।','The administrator receives your request. Your account and history update after bank verification and confirmation.')}</p><button id="transferSubmit" class="primary wide">${tr('অ্যাডমিনের কাছে পাঠান','Send to administrator')}</button></form>`);transferAmount()}
function transferAmount(){const monthly=$('transferKind').value==='monthly',input=$('transferAmount');input.readOnly=monthly;input.value=monthly?((data.cfg.installment+fee(uid))/100).toFixed(2):'';$('transferAmountNote').textContent=monthly?tr('পুরো মাসিক কিস্তি ও প্রযোজ্য ফি। আংশিক হলে অ্যাডমিনের সাথে যোগাযোগ করুন।','Full monthly contribution and applicable fee. Contact the administrator for partial transfers.'):tr('এটি সাধারণ হিসাবে যোগ হবে; ড্রয়ের মাসিক কিস্তি আলাদা।','This adds to the general account; draw contributions stay separate.')}
async function previewTransferReceipt(input){const file=input.files?.[0];if(!file)return;try{const jpeg=await compactImage(file,1280,200000);if($('transferPreview')){$('transferPreview').src=jpeg;$('transferPreview').hidden=false}}catch(err){input.value='';toast(err.message)}}
async function submitTransfer(ev){ev.preventDefault();if(busy||role!=='member')return;const kind=$('transferKind').value,text=normalizeDigits($('transferAmount').value.trim()),amount=Math.round(Number(text)*100),reference=$('transferReference').value.trim(),senderName=$('transferSenderName').value.trim(),senderAccount=normalizeDigits($('transferSenderAccount').value.trim()).replace(/\s+/g,' '),date=$('transferDate').value,note=$('transferNote').value.trim(),file=$('transferReceipt').files[0];if(!/^\d+(\.\d{1,2})?$/.test(text)||!Number.isSafeInteger(amount)||amount<1||amount>100000000||!reference||!senderName||senderName.length>80||!/^[-A-Za-z0-9 +._]{3,50}$/.test(senderAccount)||!validDate(date)||date>isoDate()||!file)return toast(tr('তথ্যগুলো ঠিক করে দিন।','Check the submission details.'));const meta={kind,amount,reference,senderName,senderAccount,date,note,...(kind==='monthly'?{cycle:data.cfg.cycle,month:data.cfg.month}:{})};const fingerprint=JSON.stringify(meta)+file.name+file.size+file.lastModified;if(!requestAttempt||requestAttempt.fingerprint!==fingerprint)requestAttempt={fingerprint,id:crypto.randomUUID()};await act(async()=>{const button=$('transferSubmit');if(button){button.disabled=true;button.innerHTML=loadingDots()}try{const jpeg=await compactImage(file,1280,200000),form=new FormData();form.append('metadata',JSON.stringify({id:requestAttempt.id,...meta}));form.append('receipt',new Blob([unb64(jpeg.split(',')[1])],{type:'image/jpeg'}),'receipt.jpg');const response=await fetch(DRAW_SERVER+'/deposit-request',{method:'POST',headers:{'X-Fund-Token':await user.getIdToken()},body:form,signal:AbortSignal.timeout(30000)}),result=await response.json();if(!response.ok)throw new Error(ledgerError(result.error));depositRequests=[result.record,...depositRequests.filter(r=>r.id!==result.record.id)];requestAttempt=null;busy=false;closeModal();render();toast(tr('রসিদ পাঠানো হয়েছে। যাচাইয়ের অপেক্ষায়।','Receipt submitted. Awaiting verification.'))}finally{if($('transferSubmit')){$('transferSubmit').disabled=false;$('transferSubmit').textContent=tr('অ্যাডমিনের কাছে পাঠান','Send to administrator')}}})}
async function viewTransfer(id){const r=depositRequests.find(x=>x.id===id);if(!r)return;currentReceiptId=id;modal(`<h2>${tr('জমার বিস্তারিত','Deposit details')}</h2><b>${e(r.name)}</b><div class="invoice spaced"><p>${tr('পরিমাণ: ','Amount: ')}${moneyPlain(r.amount)}</p><p>${r.kind==='monthly'?tr('মাসিক কিস্তি · মাস ','Monthly contribution · month ')+n(r.month):tr('সাধারণ জমা','General deposit')}</p><p>${e(r.date)}</p><p style="overflow-wrap:anywhere">${e(r.reference)}</p><p>${tr('টাকা গ্রহণের ব্যাংক: ','Receiving bank: ')}${e(r.bank)}</p><p dir="ltr">${tr('গ্রহণের অ্যাকাউন্ট: ','Receiving account: ')}${e(r.account)}</p><div class="divider"></div><p>${tr('পাঠানো অ্যাকাউন্টের নাম: ','Sending account holder: ')}${e(r.senderName||r.name||'—')}</p><p dir="ltr" style="overflow-wrap:anywhere">${tr('পাঠানো অ্যাকাউন্ট নম্বর: ','Sending account number: ')}${e(r.senderAccount||'—')}</p>${r.note?`<p>${e(r.note)}</p>`:''}<span class="pill">${e(requestStatus(r))}</span>${r.reason?`<p class="error">${e(r.reason)}</p>`:''}${r.receiptNumber?`<p class="mini">${tr('রসিদ: ','Receipt: ')}${e(r.receiptNumber)}</p>`:''}</div><p id="receiptLoading" class="mini spaced">${tr('রসিদ লোড হচ্ছে…','Loading receipt…')}</p><img id="privateTransferReceipt" hidden alt="${tr('ব্যাংকের রসিদ','Bank receipt')}" style="width:100%;max-height:65vh;object-fit:contain;border-radius:12px">${role==='admin'&&['pending','processing'].includes(r.status)?`<form class="spaced" onsubmit="reviewTransfer(event,'${e(id)}','approve')"><label class="checkbox"><input id="bankVerified" type="checkbox" required><span>${tr('নিজের ব্যাংকে টাকা এসেছে। পরিমাণ, পাঠানো অ্যাকাউন্ট ও ট্রানজেকশন নম্বর রসিদের সাথে মিলিয়ে দেখেছি।','I verified receipt of the money and matched the amount, sending account and transaction reference against the receipt.')}</span></label><button class="primary wide spaced">${tr(r.status==='processing'?'অনুমোদন শেষ করুন':'অনুমোদন দিন',r.status==='processing'?'Finish approval':'Approve')}</button></form>${r.status==='pending'?`<form class="spaced" onsubmit="reviewTransfer(event,'${e(id)}','reject')"><div class="field"><label>${tr('বাতিলের কারণ','Reason for rejection')}</label><input id="transferRejectReason" required maxlength="160"></div><button class="wide">${tr('বাতিল করুন','Reject')}</button></form>`:''}`:''}`);const owner=uid,epoch=ledgerEpoch;try{const response=await fetch(DRAW_SERVER+'/deposit-receipt?uid='+encodeURIComponent(r.uid)+'&id='+encodeURIComponent(id),{headers:{'X-Fund-Token':await user.getIdToken()},signal:AbortSignal.timeout(20000)});if(!response.ok)throw new Error();const blob=await response.blob();if(owner!==uid||epoch!==ledgerEpoch||currentReceiptId!==id||!$('privateTransferReceipt'))return;receiptBlobURL=URL.createObjectURL(blob);$('privateTransferReceipt').src=receiptBlobURL;$('privateTransferReceipt').hidden=false;$('receiptLoading').textContent=''}catch{if(currentReceiptId===id&&$('receiptLoading'))$('receiptLoading').textContent=tr('রসিদ লোড হয়নি। বন্ধ করে আবার খুলুন।','Receipt could not load. Close and reopen.')}}
async function reviewTransfer(ev,id,action){ev.preventDefault();if(role!=='admin'||busy)return;const r=depositRequests.find(x=>x.id===id);if(!r)return;const payload={id,uid:r.uid,action,...(action==='approve'?{confirmed:$('bankVerified').checked}:{reason:$('transferRejectReason').value.trim()})};await act(async()=>{const result=await ledgerCall('/deposit-review',payload);depositRequests=depositRequests.map(x=>x.id===id?result.record:x);busy=false;closeModal();render();toast(tr(result.record.status==='approved'?'জমা নিশ্চিত হয়েছে।':'আবেদন বাতিল হয়েছে।',result.record.status==='approved'?'Deposit confirmed.':'Request rejected.'));refreshAccountDeposits(false);refreshTransferRequests(false)})}
const requestBaseHome=home;home=function(){return requestBaseHome()+transferPanel()};
const requestBaseHistory=historyPage;historyPage=function(){return requestBaseHistory()+`<div class="spacer"></div><div class="card"><h2>${tr('জমার আবেদন ও রসিদ','Deposit requests and receipts')}</h2>${requestList(depositRequests)}</div>`};
const requestBaseSettings=settingsPage;settingsPage=function(){return requestBaseSettings()+bankCard()};
const requestBaseCleanup=cleanup;cleanup=function(){requestBaseCleanup();depositRequests=[];transferBank={bank:'',holder:'',account:'',instructions:''};requestSyncError='';requestAttempt=null;requestNeedsRender=false;if(receiptBlobURL)URL.revokeObjectURL(receiptBlobURL);receiptBlobURL=null};
const requestBaseClose=closeModal;closeModal=function(){if(busy)return;requestBaseClose();currentReceiptId=null;if(receiptBlobURL)URL.revokeObjectURL(receiptBlobURL);receiptBlobURL=null};
window.addEventListener('focus',()=>refreshTransferRequests(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshTransferRequests(false)});window.setInterval(()=>{if(!document.hidden)refreshTransferRequests(false)},5000);

if(location.protocol!=='file:'){sessionLoading=true;renderLoading()}else render();
</script></body></html>
