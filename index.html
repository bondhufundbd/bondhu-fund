const paymentID=(m,id)=>`${data.cfg.cycle}_${m}_${id}`;function paid(id,m=data.cfg.month){return data.payments.find(p=>p.uid===id&&p.month===m&&p.cycle===data.cfg.cycle)}

function renderAuth(){authTab='login';$('app').innerHTML=`<div class="loginbg"><div class="loginheading"><div class="brand"><div class="mark">B</div><b>${t('brand')}</b></div><button class="ghost" onclick="setLang('${lang==='bn'?'en':'bn'}')">${lang==='bn'?'English':'বাংলা'}</button></div><div class="loginlayout"><div class="loginwelcome fade"><span class="eyebrow">TOGETHER, EVERY MONTH</span><h1>${lang==='bn'?'ছোট ছোট সঞ্চয়ে,<br>বড় স্বপ্নের শুরু।':'Small savings.<br>Shared dreams.'}</h1><p>${lang==='bn'?'বিশ্বাসে একসাথে, নিয়মে এগিয়ে। আজকের দায়িত্বশীল সঞ্চয় আগামী দিনের ভরসা।':'Together in trust. Steady in commitment. Today’s savings build tomorrow’s confidence.'}</p><div class="glassorb"><span>B</span></div></div><section class="card login fade"><span class="pill">${lang==='bn'?'আপনার নিরাপদ প্রবেশদ্বার':'Your private account'}</span><h1>${t('login')}</h1><p class="muted">${t('accountByAdmin')}</p><form onsubmit="submitAuth(event)"><div class="field"><label for="authId">${t('iqama')} / ${t('adminUsername')}</label><input id="authId" required autocomplete="username" placeholder="2XXXXXXXXX / ashikadmin" autocapitalize="none" spellcheck="false"></div><div class="field"><label for="authPassword">${t('password')}</label><div class="passwordField"><input id="authPassword" type="password" required minlength="8" autocomplete="current-password"><button type="button" class="eye" onclick="togglePassword('authPassword',this)" aria-label="${t('password')}">◉</button></div></div><div id="authError" aria-live="polite"></div><button id="authSubmit" class="primary wide" ${authBusy?'disabled':''}>${authBusy?'•••':t('login')} ↗</button></form><p class="mini center spaced">${t('accountRecovery')}</p></section></div>${policyFooter()}</div>`;enhanceControls()}

async function compactImage(file,maxSize=256,maxBytes=65000){if(!file||file.size>15*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error(t('photoError'));let url=URL.createObjectURL(file);try{let image=new Image();await new Promise((res,rej)=>{image.onload=res;image.onerror=rej;image.src=url});const factor=Math.min(1,maxSize/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*factor));canvas.height=Math.max(1,Math.round(image.height*factor));let ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);let quality=.82,out=canvas.toDataURL('image/jpeg',quality);while(out.length>maxBytes&&quality>.25){quality-=.1;out=canvas.toDataURL('image/jpeg',quality)}if(out.length>maxBytes)throw new Error(t('photoError'));return out}finally{URL.revokeObjectURL(url)}}

function currencyPage(){let c=data.cfg,r=rateFor('BDT');return `<div class="card"><div class="row wrap"><div><span class="eyebrow">ONE LEDGER. YOUR CURRENCY.</span><h2 style="margin-top:7px">${t('currencyDisplay')}</h2></div><span class="pill ownerbadge">SAR ⇄ BDT</span></div><div class="formgrid spaced"><div><label>${t('currencyDisplay')}</label><select onchange="setCurrency(this.value)">${currencyOptions()}</select></div><div><label>${t('rateStatus')}</label><h2>1 SAR = ${r?n(r)+' BDT':'—'}</h2><p class="mini">${rateMeta('BDT')}</p></div></div><div class="divider"></div><p class="mini">${t('baseInfo')}</p><button onclick="refreshRates(true)">${t('refreshRates')} ↻</button></div><div class="spacer"></div><div class="card"><h2>${t('converter')}</h2><div class="formgrid spaced"><div><label for="convertAmount">${t('amount')}</label><input id="convertAmount" type="number" value="500" min="0" step="0.01" oninput="updateConverter()"></div><div><label>${t('from')}</label><select id="convertFrom" onchange="updateConverter()">${currencyOptions('SAR')}</select></div><div><label>${t('to')}</label><select id="convertTo" onchange="updateConverter()">${currencyOptions('BDT')}</select></div><div class="converter"><label>${t('total')}</label><div id="converted" style="font-size:25px">${r?n(500*r)+' BDT':'—'}</div></div></div><p class="mini spaced">${t('convertInfo')}</p></div>${role==='admin'?`<div class="spacer"></div><div class="card"><h2>${t('currencyAdd')}</h2><form onsubmit="addCurrency(event)"><div class="formgrid spaced"><div><label>${t('code')}</label><input id="newCode" placeholder="USD" minlength="3" maxlength="3" pattern="[A-Za-z]{3}" required list="currencyCodes"><datalist id="currencyCodes">${Object.keys(fxCache?.rates||{USD:1,EUR:1,AED:1,INR:1,GBP:1}).map(c=>`<option value="${e(c)}">`).join('')}</datalist></div><div><label>${t('currencyName')}</label><input id="newCurrencyName" required maxlength="40" placeholder="US Dollar"></div><div><label>${t('perSAR')} (${t('manual')})</label><input id="newRate" type="number" min="0.000001" step="any" required></div></div><div class="spacer"></div><button class="primary">+ ${t('currencyAdd')}</button></form><p class="mini spaced">${t('rateAuto')}: ${Object.keys(fxCache?.rates||{}).length} ${t('currency')} · ${t('rateManual')} ${t('save')}</p></div>`:''}`}
function updateConverter(){let value=Number($('convertAmount').value),from=$('convertFrom').value,to=$('convertTo').value,a=rateFor(from),b=rateFor(to);$('converted').textContent=a&&b&&value>=0?n(value/a*b)+' '+to:t('rateUnavailable')}
async function refreshRates(show=false){if(fxCache?.provider==='currency-api'&&Date.now()-fxCache.fetchedAt<3600000)return;for(const endpoint of ['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/sar.json','https://latest.currency-api.pages.dev/v1/currencies/sar.json']){try{const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);let res;try{res=await fetch(endpoint,{signal:ctl.signal,referrerPolicy:'no-referrer'})}finally{clearTimeout(timer)}if(!res.ok)throw new Error();const j=await res.json();if(!j.sar||j.sar.sar!==1||!Number.isFinite(j.sar.bdt)||j.sar.bdt<=0||!validDate(j.date))throw new Error();fxCache={rates:Object.fromEntries(Object.entries(j.sar).map(([k,v])=>[k.toUpperCase(),v])),time:Date.parse(j.date+'T00:00:00Z')/1000,fetchedAt:Date.now(),provider:'currency-api'};writeLocal('bf-rates',JSON.stringify(fxCache));if(show)toast(t('saved'));if(role&&!$('overlay').innerHTML)render();return}catch{}}if(show)toast(t('rateUnavailable'))}
async function addCurrency(ev){ev.preventDefault();if(role!=='admin')return;const code=$('newCode').value.trim().toUpperCase(),name=$('newCurrencyName').value.trim(),r=Number($('newRate').value);if(!/^[A-Z]{3}$/.test(code)||!Number.isFinite(r)||r<=0||code==='SAR')return toast(t('error'));let patch={currencies:[...new Set([...data.cfg.currencies,code])],currencyNames:{...data.cfg.currencyNames,[code]:name},manualRates:{...data.cfg.manualRates,[code]:r},manualOverrides:[...new Set([...(data.cfg.manualOverrides||[]),code])]};await changeConfig(patch,'Currency added: '+code);render();toast(t('currencySaved'))}
function settingsPage(){let c=data.cfg;return `<div class="card"><span class="pill ownerbadge">${t('admin')}</span><h2 style="margin-top:14px">${t('feeSettings')}</h2><p class="muted">${t('feeRule')}</p><div class="divider"></div><form onsubmit="saveSettings(event)"><div class="formgrid"><div><label>${t('rate')}</label><input id="feeRate" type="number" min="0" max="100" step="0.1" required value="${c.rate}"></div><div><label>${t('grace')}</label><input id="feeGrace" type="number" min="0" max="30" step="1" required value="${c.grace}"></div><div><label>${t('due')}</label><input id="feeDue" type="date" required value="${e(c.due)}"></div>${mode==='demo'?`<div><label>${t('demoDate')}</label><input id="feeAsOf" type="date" required value="${c.asOf}"></div>`:''}<div><label>${t('rateSource')}</label><select id="fxMode"><option value="auto" ${c.fxMode==='auto'?'selected':''}>${t('auto')}</option><option value="manual" ${c.fxMode==='manual'?'selected':''}>${t('manual')}</option></select></div><div><label>1 SAR = BDT (${t('manual')})</label><input id="bdtRate" type="number" min="0.01" step="any" required value="${c.manualRates.BDT||''}"></div></div><div class="notice spaced">${t('feeExample')}: ${n(c.installment/100)} SAR × ${n(c.rate)}% = ${n(Math.round(c.installment*c.rate/100)/100)} SAR.</div><p class="mini">${t('settingsLive')}</p><div class="spacer"></div><button class="primary">${t('save')}</button></form></div><div class="spacer"></div><div class="card"><h2>${t('cycle')}</h2><div class="entry"><span class="details">${t('monthly')}</span><b>${money(c.installment)}</b></div><div class="entry"><span class="details">${t('members')} / ${t('month')}</span><b>${n(c.roster.length)} / ${n(c.roster.length)}</b></div><p class="mini">${t('fixedCycle')}</p><div class="spacer"></div><button onclick="startCycleModal()" ${c.started&&!(c.month===c.roster.length&&c.drawDone)?'disabled':''}>${t('startCycle')}</button></div>${mode==='demo'?`<div class="spacer"></div><div class="card"><h2>${t('demo')}</h2><p class="mini">${t('resetHint')}</p><button class="danger" onclick="resetModal()">${t('resetDemo')}</button></div>`:''}`}
function modal(html){$('overlay').innerHTML=`<div class="modalback"><section class="modal fade" role="dialog" aria-modal="true" aria-label="${t('details')}"><div class="row"><span class="eyebrow">BONDHU FUND</span><button class="ghost" onclick="closeModal()" aria-label="${t('close')}">✕</button></div><div class="spacer"></div>${html}</section></div>`;$('overlay').querySelector('button')?.focus()}
function closeModal(){if(busy)return;$('overlay').innerHTML='';document.body.classList.remove('drawerOpen');drawer=false}document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();toggleDrawer(false)}});
async function act(fn){if(busy)return;busy=true;document.querySelectorAll('#overlay button').forEach(b=>b.disabled=true);try{await fn()}catch(err){toast(errorMessage(err))}finally{busy=false;document.querySelectorAll('#overlay button').forEach(b=>b.disabled=false)}}
function errorMessage(err){const code=err?.code||'';if(/auth\/(invalid-credential|user-not-found|wrong-password|invalid-email)/.test(code))return lang==='bn'?'লগইন তথ্য সঠিক নয়।':'Incorrect sign-in details.';if(code==='auth/email-already-in-use')return lang==='bn'?'এই অ্যাকাউন্ট আগে থেকেই আছে।':'This account already exists.';if(code==='auth/too-many-requests')return lang==='bn'?'অনেক চেষ্টা হয়েছে; একটু পরে চেষ্টা করুন।':'Too many attempts. Try again later.';if(code==='auth/unauthorized-domain')return lang==='bn'?'এই হোস্টিং ডোমেইন অনুমোদিত নয়।':'This hosting domain is not authorized.';if(code==='permission-denied')return lang==='bn'?'এই কাজের অনুমতি নেই।':'This action is not permitted.';if(/network|unavailable/.test(code))return t('offline');return err?.message||t('error')}
async function changeConfig(patch,action){if(role!=='admin')throw new Error(t('error'));if(mode==='demo'){data.cfg={...data.cfg,...patch};saveDemo(action);return;}await fb.f.runTransaction(fb.db,async tx=>{const ref=fb.f.doc(fb.db,'config','circle');let snap=await tx.get(ref);if(!snap.exists())throw new Error(t('error'));const previous=snap.data();if(patch.roster&&previous.started&&!(previous.month===previous.roster.length&&previous.drawDone))throw new Error(t('error'));tx.update(ref,patch);tx.set(fb.f.doc(fb.f.collection(fb.db,'audit')),{action,date:isoDate(),actor:uid,at:fb.f.serverTimestamp()})})}
async function saveSettings(ev){ev.preventDefault();if(!validDate($('feeDue').value)||(mode==='demo'&&!validDate($('feeAsOf').value)))return toast(t('error'));const rate=Number($('feeRate').value),grace=Number($('feeGrace').value),bdt=Number($('bdtRate').value);if(rate<0||rate>100||!Number.isInteger(grace)||grace<0||grace>30||!Number.isFinite(bdt)||bdt<=0)return;const patch={rate,grace,due:$('feeDue').value,fxMode:$('fxMode').value,manualRates:{...data.cfg.manualRates,BDT:bdt},manualOverrides:(data.cfg.manualOverrides||[]).filter(code=>code!=='BDT')};if(mode==='demo')patch.asOf=$('feeAsOf').value;await act(async()=>{await changeConfig(patch,'Late fee / FX settings changed');render();toast(t('saved'))})}
function paymentModal(){if(role!=='admin')return;let list=data.members.filter(m=>data.cfg.roster.includes(m.uid)&&!paid(m.uid));if(!list.length)return toast(t('paid'));modal(`<h2>${t('payRecord')}</h2><form onsubmit="recordPayment(event)"><div class="field"><label>${t('member')}</label><select id="payMember" onchange="paymentSummary()">${list.map(m=>`<option value="${e(m.uid)}">${e(memberName(m))}</option>`).join('')}</select></div><div class="field"><label>${t('currencyDisplay')}</label><select id="payCurrency" onchange="paymentSummary()">${currencyOptions(currency)}</select></div><div id="paySummary"></div><div class="field"><label>${t('method')}</label><select id="payMethod"><option value="bank">${t('bank')}</option><option value="cash">${t('cash')}</option></select></div><div class="field"><label>${t('reference')}</label><input id="payReference" required maxlength="80" placeholder="${mode==='demo'?'DEMO-009':''}"></div><label class="checkbox"><input type="checkbox" required><span>${t('paymentConfirm')}</span></label><p class="mini spaced">${t('convertInfo')}</p><button class="primary wide">${t('confirm')}</button></form>`);paymentSummary()}
function paymentSummary(){let id=$('payMember').value,code=$('payCurrency').value,r=rateFor(code),base=data.cfg.installment,f=fee(id);$('paySummary').innerHTML=`<div class="invoice">${[[t('principal'),base],[t('fee'),f],[lang==='bn'?'মোট জমা':'Total received',base+f]].map(([label,value])=>`<div class="invoiceRow"><span>${label}</span><b>${money(value,code)}</b></div>`).join('')}</div><p class="mini">${t('currencyAccounting')}: ${n((base+f)/100)} SAR</p>${!r?`<p class="error">${t('rateUnavailable')}</p>`:''}`}

async function recordPayment(ev){ev.preventDefault();if(role!=='admin')return;const id=$('payMember').value,code=$('payCurrency').value,r=rateFor(code),method=$('payMethod').value,reference=$('payReference').value.trim(),cycle=data.cfg.cycle,month=data.cfg.month;if(!r||!reference||paid(id))return toast(t('error'));await act(async()=>{if(mode==='demo'){let c=data.cfg,f=fee(id);data.payments.push({id:paymentID(month,id),uid:id,cycle,month,base:c.installment,fee:f,date:c.asOf,method,reference,originalCurrency:code,originalAmount:Math.round((c.installment+f)*r)/100,fx:r});c.collected+=c.installment;c.paidCount++;c.paidUids.push(id);saveDemo('Payment recorded: '+id+' / '+month)}else{await fb.f.runTransaction(fb.db,async tx=>{const cr=fb.f.doc(fb.db,'config','circle'),pr=fb.f.doc(fb.db,'payments',`${cycle}_${month}_${id}`);const cs=await tx.get(cr),ps=await tx.get(pr);let c=cs.data();if(ps.exists()||c.cycle!==cycle||c.month!==month||!c.started||!c.roster.includes(id))throw new Error(t('error'));const lateNow=(Date.parse(isoDate()+'T00:00:00Z')-Date.parse(c.due+'T00:00:00Z'))/86400000>c.grace,f=lateNow?Math.round(c.installment*c.rate/100):0;tx.set(pr,{uid:id,cycle,month,base:c.installment,fee:f,date:isoDate(),method,reference,originalCurrency:code,originalAmount:Math.round((c.installment+f)*r)/100,fx:r,actor:uid,at:fb.f.serverTimestamp()});tx.update(cr,{collected:c.collected+c.installment,paidCount:c.paidCount+1,paidUids:[...(c.paidUids||[]),id]});tx.set(fb.f.doc(fb.f.collection(fb.db,'audit')),{action:'Payment recorded: '+id+' / '+month,date:isoDate(),actor:uid,at:fb.f.serverTimestamp()})})}busy=false;closeModal();render();toast(t('recorded'))})}

function randomIndex(size){const array=new Uint32Array(1),limit=4294967296-4294967296%size;do{crypto.getRandomValues(array)}while(array[0]>=limit);return array[0]%size}

async function advanceMonth(ev){ev.preventDefault();const due=$('nextDue').value,oldMonth=data.cfg.month,cycle=data.cfg.cycle;if(!validDate(due)||due<=data.cfg.due)return toast(t('error'));await act(async()=>{if(mode==='demo'){if(!data.cfg.drawDone||oldMonth>=data.cfg.roster.length)throw new Error(t('error'));Object.assign(data.cfg,{month:oldMonth+1,due,asOf:due,collected:0,paidCount:0,paidUids:[],drawDone:false});saveDemo('New month: '+(oldMonth+1))}else await fb.f.runTransaction(fb.db,async tx=>{let ref=fb.f.doc(fb.db,'config','circle'),s=await tx.get(ref),c=s.data();if(!c.drawDone||c.cycle!==cycle||c.month!==oldMonth||c.month>=c.roster.length)throw new Error(t('error'));tx.update(ref,{month:c.month+1,due,collected:0,paidCount:0,paidUids:[],drawDone:false});tx.set(fb.f.doc(fb.f.collection(fb.db,'audit')),{action:'New month: '+(c.month+1),date:isoDate(),actor:uid,at:fb.f.serverTimestamp()})});busy=false;closeModal();render();toast(t('startMonth'))})}
function startCycleModal(){if(role!=='admin')return;let c=data.cfg;if(c.started&&!(c.month===c.roster.length&&c.drawDone))return;let approved=data.members.filter(m=>m.status==='approved'&&!m.isAdmin);modal(`<h2>${t('startCycle')}</h2><p class="mini">${t('startCycleInfo')}</p><form onsubmit="startCycle(event)"><div class="field"><label>${t('monthly')} (SAR)</label><input id="cycleAmount" type="number" min="1" step="0.01" required value="500"></div><div class="field"><label>${t('due')}</label><input id="cycleDue" type="date" required value="${isoDate()}"></div>${approved.map(m=>`<label class="checkitem"><input type="checkbox" name="roster" value="${e(m.uid)}" checked>${avatar(m,'smallavatar')}<span>${e(memberName(m))}</span></label>`).join('')||`<p class="muted">${t('empty')}</p>`}<div class="spacer"></div><button class="primary wide">${t('confirm')}</button></form>`)}
async function startCycle(ev){ev.preventDefault();const roster=[...document.querySelectorAll('input[name="roster"]:checked')].map(i=>i.value),installment=Math.round(Number($('cycleAmount').value)*100),due=$('cycleDue').value;if(role!=='admin'||roster.some(id=>data.members.find(m=>m.uid===id)?.isAdmin)||!validDate(due)||roster.length<2||roster.length>100||!Number.isSafeInteger(installment)||installment<=0)return toast(lang==='bn'?'২–১০০ জন সদস্য বেছে নিন।':'Select 2–100 members.');await act(async()=>{const nextCycle=data.cfg.started?'cycle-'+(Number(data.cfg.cycle.replace('cycle-',''))+1):data.cfg.cycle;await changeConfig({cycle:nextCycle,roster,installment,due,asOf:due,month:1,started:true,collected:0,paidCount:0,paidUids:[],drawDone:false,winners:[]},'New cycle started: '+nextCycle);busy=false;closeModal();render();toast(t('saved'))})}

async function changeFirstPassword(ev){ev.preventDefault();let old=$('firstOld').value,next=$('firstNew').value,repeat=$('firstConfirm').value;if(next!==repeat)return toast(t('passwordMismatch'));if(!/^(?=.*[A-Z])(?=.*\d).{8,}$/.test(next)||next===old)return toast(t('passwordHint'));await act(async()=>{await fb.a.reauthenticateWithCredential(user,fb.a.EmailAuthProvider.credential(user.email,old));await fb.a.updatePassword(user,next);await fb.f.updateDoc(fb.f.doc(fb.db,'members',uid),{mustChangePassword:false});me().mustChangePassword=false;await attachUser(user);toast(t('passwordChanged'))})}

function enhanceControls(){document.querySelectorAll('select').forEach((select,index)=>{if(select.dataset.glass)return;select.dataset.glass='1';if(!select.id)select.id='glass-select-'+Date.now()+'-'+index;select.tabIndex=-1;select.setAttribute('aria-hidden','true');const button=document.createElement('button');button.type='button';button.className='glassSelect';button.innerHTML=`<span>${e(select.selectedOptions[0]?.textContent||t('choose'))}</span><span>⌄</span>`;button.setAttribute('aria-label',select.getAttribute('aria-label')||t('choose'));button.onclick=()=>openSelect(select);select.insertAdjacentElement('afterend',button)});document.querySelectorAll('input[type="date"]').forEach(input=>{input.type='text';input.dataset.date='1';input.pattern='\\d{4}-\\d{2}-\\d{2}';input.placeholder='YYYY-MM-DD';input.inputMode='numeric';const button=document.createElement('button');button.type='button';button.className='calendarButton';button.textContent='▦';button.setAttribute('aria-label',t('calendar'));button.onclick=()=>openCalendar(input);input.insertAdjacentElement('afterend',button)})}
function pickerContainer(){closePicker();const node=document.createElement('div');node.id='picker';node.className='pickerBack';node.onclick=ev=>{if(ev.target===node)closePicker()};document.body.appendChild(node);return node}
function openSelect(select){const node=pickerContainer();node.innerHTML=`<section class="glassPicker" role="dialog" aria-modal="true"><div class="row"><h3>${e(select.getAttribute('aria-label')||t('choose'))}</h3><button type="button" class="ghost" onclick="closePicker()">✕</button></div><div class="pickerOptions" role="listbox">${[...select.options].map((option,i)=>`<button type="button" role="option" aria-selected="${option.value===select.value}" data-index="${i}" class="${option.value===select.value?'chosen':''}"><span>${e(option.textContent)}</span><span>${option.value===select.value?'●':'○'}</span></button>`).join('')}</div></section>`;node.querySelectorAll('[data-index]').forEach(button=>button.onclick=()=>{select.value=select.options[Number(button.dataset.index)].value;closePicker();select.nextElementSibling?.querySelector('span')?.replaceChildren(document.createTextNode(select.selectedOptions[0].textContent));select.dispatchEvent(new Event('change',{bubbles:true}))});node.querySelector('.chosen')?.focus()}
function openCalendar(input,year,month){const old=new Date(/^\d{4}-\d{2}-\d{2}$/.test(input.value)?input.value+'T12:00:00Z':isoDate()+'T12:00:00Z');year=year??old.getUTCFullYear();month=month??old.getUTCMonth();const normalized=new Date(Date.UTC(year,month,1));year=normalized.getUTCFullYear();month=normalized.getUTCMonth();const first=normalized.getUTCDay(),days=new Date(Date.UTC(year,month+1,0)).getUTCDate(),node=pickerContainer();node.innerHTML=`<section class="glassPicker"><div class="row"><button type="button" id="calPrev">‹</button><b>${normalized.toLocaleDateString(lang==='bn'?'bn-BD':'en-US',{year:'numeric',month:'long',timeZone:'UTC'})}</b><button type="button" id="calNext">›</button></div><div class="calendarGrid spaced">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(s=>`<span class="mini">${s}</span>`).join('')}${Array.from({length:first},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>`<button type="button" data-day="${i+1}">${n(i+1)}</button>`).join('')}</div><button class="ghost wide spaced" onclick="closePicker()">${t('close')}</button></section>`;node.querySelector('#calPrev').onclick=()=>openCalendar(input,year,month-1);node.querySelector('#calNext').onclick=()=>openCalendar(input,year,month+1);node.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{input.value=year+'-'+String(month+1).padStart(2,'0')+'-'+String(b.dataset.day).padStart(2,'0');input.dispatchEvent(new Event('change',{bubbles:true}));closePicker()})}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closePicker()});
let imgbbKeyMemory=null,docEpoch=0,docObjectURLs=[];
async function imgbbKey(){if(imgbbKeyMemory)return imgbbKeyMemory;const snap=await fb.f.getDoc(fb.f.doc(fb.db,'secrets','imgbb'));const key=snap.data()?.key;if(typeof key!=='string'||key.length<10)throw new Error(t('hostingMissing'));imgbbKeyMemory=key;return key}
async function uploadImgBB(image,name){let form=new FormData();form.append('key',await imgbbKey());form.append('image',image.split(',')[1]);form.append('name',name);const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),45000);try{const response=await fetch('https://api.imgbb.com/1/upload',{method:'POST',body:form,signal:ctl.signal,referrerPolicy:'no-referrer'}),result=await response.json();if(!response.ok||!result.success||!/^https:\/\/i\.ibb\.co\//.test(result.data?.url||''))throw new Error(t('error'));return result.data.url}finally{clearTimeout(timer)}}
function b64(bytes){return btoa(String.fromCharCode(...bytes))}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function packCipher(cipher){const width=256,height=Math.ceil((cipher.length+4)/(width*3)),canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d'),pixels=ctx.createImageData(width,height),payload=new Uint8Array(cipher.length+4);new DataView(payload.buffer).setUint32(0,cipher.length);payload.set(cipher,4);for(let p=0;p<width*height;p++){pixels.data[p*4]=payload[p*3]||0;pixels.data[p*4+1]=payload[p*3+1]||0;pixels.data[p*4+2]=payload[p*3+2]||0;pixels.data[p*4+3]=255}ctx.putImageData(pixels,0,0);return canvas.toDataURL('image/png')}
async function encryptedImage(jpeg){const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']),iv=crypto.getRandomValues(new Uint8Array(12)),bytes=unb64(jpeg.split(',')[1]),cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));return {png:packCipher(cipher),key:b64(new Uint8Array(await crypto.subtle.exportKey('raw',key))),iv:b64(iv),length:cipher.length}}
async function decodeDocument(record){if(record.image)return record.image;if(!record.url||!record.key||!record.iv)throw new Error(t('error'));let image=new Image();image.crossOrigin='anonymous';await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=record.url});if(image.width*image.height>2000000)throw new Error(t('error'));let canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;let ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data,payload=new Uint8Array(image.width*image.height*3);for(let p=0;p<image.width*image.height;p++){payload[p*3]=pixels[p*4];payload[p*3+1]=pixels[p*4+1];payload[p*3+2]=pixels[p*4+2]}const len=new DataView(payload.buffer).getUint32(0);if(len!==record.length||len>payload.length-4)throw new Error(t('error'));const key=await crypto.subtle.importKey('raw',unb64(record.key),{name:'AES-GCM'},false,['decrypt']),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(record.iv)},key,payload.slice(4,len+4));let url=URL.createObjectURL(new Blob([plain],{type:'image/jpeg'}));docObjectURLs.push(url);return url}
async function hydrateDocuments(records){const epoch=++docEpoch;let result={};for(const [type,record] of Object.entries(records)){try{result[type]={...record,image:await decodeDocument(record)}}catch{result[type]={...record,failed:true}}}if(epoch!==docEpoch)return;privateDocs=result;if(view==='profile'&&!$('overlay').innerHTML&&!busy)render()}
async function uploadPhoto(input){if(role!=='admin')return;const file=input.files?.[0];if(!file)return;await act(async()=>{const photo=await compactImage(file,512,180000);if(mode==='demo'){me().photo=photo;saveDemo()}else await fb.f.updateDoc(fb.f.doc(fb.db,'members',uid),{photo:await uploadImgBB(photo,'profile-'+uid)});render();toast(t('saved'))})}
async function uploadDocument(input,type){if(role!=='admin')return;const file=input.files?.[0];if(!file)return;await act(async()=>{const image=await compactImage(file,1100,280000);if(mode==='demo'){privateDocs[type]={image};render();return toast(t('demoNote'))}const encrypted=await encryptedImage(image),url=await uploadImgBB(encrypted.png,'private-document');const record={url,key:encrypted.key,iv:encrypted.iv,length:encrypted.length,codec:'AES-GCM-RGB-v1',updatedAt:fb.f.serverTimestamp()};await fb.f.setDoc(fb.f.doc(fb.db,'profiles',uid,'documents',type),record);privateDocs[type]={...record,image};render();toast(t('saved'))})}
async function adminDocuments(id){if(role!=='admin'||mode!=='live')return;await act(async()=>{const snap=await fb.f.getDocs(fb.f.collection(fb.db,'profiles',id,'documents'));const items=[];for(const doc of snap.docs){items.push({id:doc.id,image:await decodeDocument(doc.data())})}modal(`<h2>${t('documents')}</h2><p class="private">${t('private')}</p>${items.map(d=>`<div class="docbox spaced"><label>${t(d.id==='iqama'?'docIqama':'docPassport')}</label><img style="max-width:100%" src="${e(d.image)}" alt="${t('preview')}"></div>`).join('')||`<p>${t('noDoc')}</p>`}`)})}
render();

s.'}</p></details><div class="copyright">© ${new Date().getFullYear()} Bondhu Fund · Mohammed Ashik</div></footer>`}
