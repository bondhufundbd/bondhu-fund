 class="toptools"><select aria-label="Language" onchange="setLang(this.value)"><option value="bn" ${lang==='bn'?'selected':''}>বাংলা</option><option value="en" ${lang==='en'?'selected':''}>EN</option></select><select aria-label="${t('currencyDisplay')}" onchange="setCurrency(this.value)">${currencyOptions()}</select>${role==='member'?`<button class="avatarbutton" onclick="navigate('profile')" aria-label="${t('profile')}">${avatar(member)}</button>`:''}</div></header><div class="statusbar"><span class="pill">${t(role==='admin'?'admin':'member')}</span><span class="mini"><button class="helpbtn" onclick="roundHelp()">${t('roundHelp')}</button> · ${data.cfg.started?t('cycle')+' '+e(data.cfg.cycle.replace('cycle-',''))+' · '+n(data.cfg.month)+' / '+n(data.cfg.roster.length)+' '+t('month'):t('cycleNotStarted')}</span></div>${mode==='demo'?`<div class="notice">${t('demoNote')} ${t('liveOnly')}</div>`:''}${pending?`<div class="pendingBanner"><h3>${t('pending')}</h3><p class="muted">${t('pendingText')}</p></div><div class="spacer"></div>`:''}<section class="fade">${view==='documents'?adminDocumentPage():view==='home'?home():view==='profile'?profilePage():view==='members'?membersPage():view==='draw'?drawPage():view==='history'?historyPage():view==='currency'?currencyPage():settingsPage()}</section>${policyFooter()}</main></div>`}
function renderAuth(){authTab='login';$('app').innerHTML=`<div class="loginbg"><header class="loginheading"><div class="brand"><div class="mark">B</div><b>${t('brand')}</b></div><button class="ghost" onclick="setLang('${lang==='bn'?'en':'bn'}')">${lang==='bn'?'English':'বাংলা'}</button></header><div class="loginlayout fade"><section class="loginwelcome"><span class="eyebrow">BONDHU FUND</span><h1>${lang==='bn'?'সঞ্চয়ে ভরসা।':'Save with trust.'}</h1><p>${lang==='bn'?'আজকের সঞ্চয়, আগামী দিনের শক্তি।':'Today’s savings. Tomorrow’s strength.'}</p><div class="trustSeal"><span>B</span></div><div class="welcomefoot"><span>${lang==='bn'?'একসাথে এগিয়ে যাই':'Growing together'}</span><span>${lang==='bn'?'সবার আস্থা':'SHARED TRUST'}</span></div></section><section class="login"><span class="eyebrow">${lang==='bn'?'আপনার ব্যক্তিগত হিসাব':'YOUR PRIVATE ACCOUNT'}</span><h1>${t('login')}</h1><p class="muted">${t('accountByAdmin')}</p><form onsubmit="submitAuth(event)"><div class="field"><input id="authId" required autocomplete="username" aria-label="${lang==='bn'?'নাম্বার':'Number'}" placeholder="${lang==='bn'?'নাম্বার':'Number'}" autocapitalize="none" spellcheck="false"></div><div class="field"><div class="passwordField"><input id="authPassword" type="password" required minlength="8" autocomplete="current-password" aria-label="${t('password')}" placeholder="${t('password')}"><button type="button" class="eye" onclick="togglePassword('authPassword',this)" aria-label="${t('password')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div id="authError" aria-live="polite"></div><button id="authSubmit" class="primary wide" ${authBusy?'disabled':''}>${authBusy?'•••':t('login')} <span>→</span></button></form><button class="helpbtn spaced" onclick="loginHelp()">${lang==='bn'?'লগইন সাহায্য':'Sign-in help'} ↗</button></section></div>${policyFooter function stat(label,cents,caption,plain=false){return `<div class="card stat"><small>${t(label)}</small><div class="value">${plain?n(cents):money(cents)}</div>${plain?'':baseNote(cents)}<small>${caption}</small></div>`}
function currentPayments(){return data.payments.filter(p=>p.cycle===data.cfg.cycle)}function ownPayments(){return currentPayments().filter(p=>p.uid===uid)}function eligible(){return data.members.filter(m=>data.cfg.roster.includes(m.uid)&&m.status==='approved'&&!m.isAdmin&&!data.cfg.winners.includes(m.uid)&&(data.cfg.paidUids||[]).includes(m.uid))}
function home(){const c=data.cfg,total=c.installment*c.roster.length,ps=ownPayments(),own=ps.reduce((a,p)=>a+p.base,0),mine=c.roster.includes(uid);if(role==='member')return `<div class="hero"><span class="pill">${lang==='bn'?'আপনার ব্যক্তিগত হিসাব':'Your personal account'}</span><p>${t('myPaid')} · ${t('cycle')} ${e(c.cycle.replace('cycle-',''))}</p><div class="amount">${money(own)}</div>${baseNote(own)}<div class="progress"><span style="width:${total?Math.min(100,own/total*100):0}%"></span></div><p class="mini">${mine?n(ps.length)+' / '+n(c.roster.length)+' '+t('month'):t('waitingNext')}</p></div><div class="stats">${stat('myRemaining',mine?Math.max(0,total-own):0,t('principalOnly'))}${stat('received',data.payouts.filter(p=>p.uid===uid&&p.delivered).reduce((a,p)=>a+(data.draws.find(d=>d.id===p.id)?.amount||0),0),t('received'))}${stat('fee',mine?fee(uid):0,t('separateFund'))}</div>${mine&&!paid(uid)?`<div class="notice">${t('monthly')}: ${money(c.installment)} · ${t('due')}: ${e(c.due)}</div>`:''}<div class="card spaced"><div class="row"><h2>${t('recent')}</h2><button onclick="navigate('history')">${t('seeAll')} ↗</button></div>${ps.slice(-5).reverse().map(entry).join('')||`<div class="empty">${t('empty')}</div>`}</div>`;return `<div class="notice">${lang==='bn'?'অ্যাডমিন টাকা পাবেন না।':'The admin receives no fund payout.'}</div><div class="hero spaced"><div class="row wrap"><span class="pill">${lang==='bn'?'সদস্যদের যৌথ তহবিল':'Members’ collective fund'}</span><span class="mini">${c.started?t('month')+' '+n(c.month):t('cycleNotStarted')}</span></div><p>${lang==='bn'?'এই মাসে সদস্যদের মূল জমা':'Principal collected from members this month'}</p><div class="amount">${money(c.collected||0)}</div>${baseNote(c.collected||0)}<div class="progress"><span style="width:${total?Math.min(100,(c.collected||0)/total*100):0}%"></span></div><div class="row wrap mini"><span>${n(c.paidCount||0)} / ${n(c.roster.length)} ${t('paidMembers')}</span><span>${t('target')} ${money(total)}</span></div><div class="buttonrow spaced"><button class="primary" onclick="paymentModal()" ${!c.started?'disabled':''}>+ ${t('payRecord')}</button><button onclick="navigate('settings')">${t('settings')} ↗</button></div></div><div class="stats">${stat('totalMembers',data.members.filter(m=>!m.isAdmin&&m.status==='approved').length,t('members'),true)}${stat('outstanding',Math.max(0,total-(c.collected||0)),t('principalOnly'))}${stat('fineDue',c.roster.reduce((a,id)=>a+fee(id),0),t('separateFund'))}</div><div class="card"><div class="row"><h2>${t('recent')}</h2><button onclick="navigate('history')">${t('seeAll')} ↗</button></div>${currentPayments().slice(-5).reverse().map(entry).join('')||`<div class="empty">${t('empty')}</div>`}</div>`}

function membersPage(){return `<div class="row wrap"><div><h2>${t('directory')}</h2><p class="muted">${n(data.members.length)} ${t('members')}</p></div><div class="buttonrow"><span class="pill">${t('secureAccess')}</span>${role==='admin'?`<button class="primary" onclick="createMemberModal()">+ ${t('createMember')}</button>`:''}</div></div><div class="filters"><input id="memberSearch" placeholder="${t('search')}" oninput="filterMembers(this.value)"></div><div class="card tablewrap"><table><thead><tr><th>${t('member')}</th><th>${t('active')}</th><th>${t('draw')}</th>${role==='admin'?`<th>${t('monthly')}</th><th>${t('fee')}</th><th></th>`:''}</tr></thead><tbody id="memberRows">${memberRows('')}</tbody></table></div><p class="mini spaced">${t('joinNext')}</p>`}

function profilePage(){if(role==='admin')return adminDocumentPage();const p=privateProfile;return `<div class="card profileCard"><div class="profilecover"></div><div class="profilecontent">${avatar(me(),'photohero')}<div class="row spaced"><div><h2>${e(memberName(me()))}</h2><span class="pill">${t('member')}</span></div><button class="primary" type="button" onclick="$('photoInput').click()">${t('changePhoto')}</button><input type="file" id="photoInput" hidden accept="image/jpeg,image/png,image/webp" onchange="uploadPhoto(this)"></div><p class="mini">${t('photoHint')}</p><div class="divider"></div><h2>${t('identity')}</h2><div class="identitygrid">${[['name',me().name],['iqama',p.iqama],['passport',p.passport],['phone',p.phone]].map(([k,v])=>`<div><span class="mini">${t(k)}</span><p>${e(v||'—')}</p></div>`).join('')}</div><div class="divider"></div><button onclick="passwordModal()">${t('resetPassword')}</button></div></div>`}

async function saveProfile(ev){if(role!=='admin')return;ev.preventDefault();let name=$('profileName').value.trim(),p={phone:$('profilePhone').value.trim(),iqama:$('profileIqama').value.trim(),passport:$('profilePassport').value.trim(),email:$('profileEmail').value.trim()};if(!name)return;if(mode==='demo'){me().name=name;me().nameEN=name;data.profiles=data.profiles||{};data.profiles[uid]={phone:p.phone,email:p.email};saveDemo();render();return toast(t('saved'))}await act(async()=>{let batch=fb.f.writeBatch(fb.db);batch.update(fb.f.doc(fb.db,'members',uid),{name});batch.set(fb.f.doc(fb.db,'profiles',uid),p,{merge:true});await batch.commit();privateProfile={...privateProfile,...p};toast(t('saved'))})}
async function compactImage(file,maxSize=256,maxBytes=65000){if(!file||file.size>15*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error(t('photoError'));let url=URL.createObjectURL(file);try{let image=new Image();await new Promise((res,rej)=>{image.onload=res;image.onerror=rej;image.src=url});const factor=Math.min(1,maxSize/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*factor));canvas.height=Math.max(1,Math.round(image.height*factor));let ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);let quality=.82,out=canvas.toDataURL('image/jpeg',quality);while(out.length>maxBytes&&quality>.25){quality-=.1;out=canvas.toDataURL('image/jpeg',quality)}if(out.length>maxBytes)throw new Error(t('photoError'));return out}finally{URL.revokeObjectURL(url)}}
async function uploadPhoto(input){if(role!=='member'||mode!=='live')return;const file=input.files?.[0];if(!file)return;await act(async()=>{const jpeg=await compactImage(file,512,180000),response=await fetch(DRAW_SERVER+'/photo',{method:'POST',headers:{'X-Fund-Token':await user.getIdToken(),'Content-Type':'image/jpeg'},body:new Blob([unb64(jpeg.split(',')[1])],{type:'image/jpeg'})});let result;try{result=await response.json()}catch{throw new Error(t('serverPending'))}if(!response.ok||!/^https:\/\/i\.ibb\.co\//.test(result.url||''))throw new Error(t('serverPending'));await fb.f.updateDoc(fb.f.doc(fb.db,'members',uid),{photo:result.url});me().photo=result.url;render();toast(t('saved'))})}

async function uploadDocument(input,type){if(role!=='admin')return;const file=input.files?.[0];if(!file)return;await act(async()=>{const image=await compactImage(file,1100,280000);if(mode==='demo'){privateDocs[type]={image};render();return toast(t('demoNote'))}let record={image,updatedAt:fb.f.serverTimestamp()};await fb.f.setDoc(fb.f.doc(fb.db,'profiles',uid,'documents',type),record);privateDocs[type]=record;render();toast(t('saved'))})}

function drawPage(){const c=data.cfg,current=data.draws.find(d=>d.cycle===c.cycle&&d.month===c.month),list=eligible(),ready=c.started&&c.paidCount===c.roster.length&&list.length>0;return `<div class="drawlayout"><div class="card drawStage center"><span class="pill">${t('month')} ${n(c.month)}</span><div class="drawart">${icon('draw')}</div><h2>${current?t('winner'):t('draw')}</h2><div class="amount">${current?e(memberName(data.members.find(m=>m.uid===current.uid))):money(c.started?c.installment*c.roster.length:0)}</div><p class="mini">${lang==='bn'?'অ্যাডমিন বিজয়ী ঠিক করতে পারবেন না।':'The admin cannot choose the winner.'}</p><button class="primary wide spaced" onclick="drawModal()" ${!ready||current?'disabled':''}>${t(current?'drawComplete':'startDraw')} →</button>${!ready&&!current?`<p class="mini">${lang==='bn'?'সবার মূল জমা সম্পূর্ণ হতে হবে।':'All principal deposits are required.'}</p>`:''}${current&&c.month<c.roster.length?`<button class="wide spaced" onclick="nextMonthModal()" ${!data.payouts.some(p=>p.id===current.id&&p.delivered)?'disabled':''}>${t('nextMonth')} →</button>`:''}</div><div class="card"><h2>${t('eligible')}</h2>${list.map(m=>`<div class="entry">${avatar(m)}<span class="details">${e(memberName(m))}</span><span class="pill">✓</span></div>`).join('')||`<div class="empty">${t('empty')}</div>`}</div></div><div class="card spaced"><h2>${t('pastDraw')}</h2>${data.draws.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.month-a.month).map(d=>{const payout=data.payouts.find(p=>p.id===d.id);return `<div class="entry"><div class="details"><b>${e(memberName(data.members.find(m=>m.uid===d.uid)))}</b><div class="mini">${t('month')} ${n(d.month)} · ${e(d.date)}</div></div><div class="right"><b>${money(d.amount)}</b>${!payout?.delivered&&!d.delivered?`<button class="spaced" onclick="payoutModal('${e(d.id)}')">${t('confirmPayout')}</button>`:`<div class="mini">${t('payoutDone')}</div>`}</div></div>`}).join('')||`<div class="empty">${t('empty')}</div>`}</div>`}

function openCalendar(input,year,month){const old=new Date(/^\d{4}-\d{2}-\d{2}$/.test(input.value)?input.value+'T12:00:00Z':isoDate()+'T12:00:00Z');year=year??old.getUTCFullYear();month=month??old.getUTCMonth();const normalized=new Date(Date.UTC(year,month,1));year=normalized.getUTCFullYear();month=normalized.getUTCMonth();const first=normalized.getUTCDay(),days=new Date(Date.UTC(year,month+1,0)).getUTCDate(),node=pickerContainer();node.innerHTML=`<section class="glassPicker"><div class="row"><button type="button" id="calPrev">‹</button><b>${normalized.toLocaleDateString(lang==='bn'?'bn-BD':'en-US',{year:'numeric',month:'long',timeZone:'UTC'})}</b><button type="button" id="calNext">›</button></div><div class="calendarGrid spaced">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(s=>`<span class="mini">${s}</span>`).join('')}${Array.from({length:first},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>`<button type="button" data-day="${i+1}">${n(i+1)}</button>`).join('')}</div><button class="ghost wide spaced" onclick="closePicker()">${t('close')}</button></section>`;node.querySelector('#calPrev').onclick=()=>openCalendar(input,year,month-1);node.querySelector('#calNext').onclick=()=>openCalendar(input,year,month+1);node.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{input.value=year+'-'+String(month+1).padStart(2,'0')+'-'+String(b.dataset.day).padStart(2,'0');input.dispatchEvent(new Event('change',{bubbles:true}));closePicker()})}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closePicker()});
let imgbbKeyMemory=null,docEpoch=0,docObjectURLs=[];
async function imgbbKey(){if(imgbbKeyMemory)return imgbbKeyMemory;const snap=await fb.f.getDoc(fb.f.doc(fb.db,'secrets','imgbb'));const key=snap.data()?.key;if(typeof key!=='string'||key.length<10)throw new Error(t('hostingMissing'));imgbbKeyMemory=key;return key}
async function uploadImgBB(image,name){let form=new FormData();form.append('key',await imgbbKey());form.append('image',image.split(',')[1]);form.append('name',name);const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),45000);try{const response=await fetch('https://api.imgbb.com/1/upload',{method:'POST',body:form,signal:ctl.signal,referrerPolicy:'no-referrer'}),result=await response.json();if(!response.ok||!result.success||!/^https:\/\/i\.ibb\.co\//.test(result.data?.url||''))throw new Error(t('error'));return result.data.url}finally{clearTimeout(timer)}}
function b64(bytes){return btoa(String.fromCharCode(...bytes))}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function packCipher(cipher){const width=256,height=Math.ceil((cipher.length+4)/(width*3)),canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d'),pixels=ctx.createImageData(width,height),payload=new Uint8Array(cipher.length+4);new DataView(payload.buffer).setUint32(0,cipher.length);payload.set(cipher,4);for(let p=0;p<width*height;p++){pixels.data[p*4]=payload[p*3]||0;pixels.data[p*4+1]=payload[p*3+1]||0;pixels.data[p*4+2]=payload[p*3+2]||0;pixels.data[p*4+3]=255}ctx.putImageData(pixels,0,0);return canvas.toDataURL('image/png')}
async function encryptedImage(jpeg){const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']),iv=crypto.getRandomValues(new Uint8Array(12)),bytes=unb64(jpeg.split(',')[1]),cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));return {png:packCipher(cipher),key:b64(new Uint8Array(await crypto.subtle.exportKey('raw',key))),iv:b64(iv),length:cipher.length}}
async function decodeDocument(record){if(record.image)return record.image;if(!record.url||!record.key||!record.iv)throw new Error(t('error'));let image=new Image();image.crossOrigin='anonymous';await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=record.url});if(image.width*image.height>2000000)throw new Error(t('error'));let canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;let ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data,payload=new Uint8Array(image.width*image.height*3);for(let p=0;p<image.width*image.height;p++){payload[p*3]=pixels[p*4];payload[p*3+1]=pixels[p*4+1];payload[p*3+2]=pixels[p*4+2]}const len=new DataView(payload.buffer).getUint32(0);if(len!==record.length||len>payload.length-4)throw new Error(t('error'));const key=await crypto.subtle.importKey('raw',unb64(record.key),{name:'AES-GCM'},false,['decrypt']),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(record.iv)},key,payload.slice(4,len+4));let url=URL.createObjectURL(new Blob([plain],{type:'image/jpeg'}));docObjectURLs.push(url);return url}
async function hydrateDocuments(records){const epoch=++docEpoch;let result={};for(const [type,record] of Object.entries(records)){try{result[type]={...record,image:await decodeDocument(record)}}catch{result[type]={...record,failed:true}}}if(epoch!==docEpoch)return;privateDocs=result;if(['profile','documents'].includes(view)&&!$('overlay').innerHTML&&!busy)render()}
async function uploadPhoto(input){if(role!=='member'||mode!=='live')return;const file=input.files?.[0];if(!file)return;await act(async()=>{const jpeg=await compactImage(file,512,180000),response=await fetch(DRAW_SERVER+'/photo',{method:'POST',headers:{'X-Fund-Token':await user.getIdToken(),'Content-Type':'image/jpeg'},body:new Blob([unb64(jpeg.split(',')[1])],{type:'image/jpeg'})});let result;try{result=await response.json()}catch{throw new Error(t('serverPending'))}if(!response.ok||!/^https:\/\/i\.ibb\.co\//.test(result.url||''))throw new Error(t('serverPending'));await fb.f.updateDoc(fb.f.doc(fb.db,'members',uid),{photo:result.url});me().photo=result.url;render();toast(t('saved'))})}
async function uploadDocument(input,type){if(role!=='admin')return;const file=input.files?.[0];if(!file)return;await act(async()=>{const image=await compactImage(file,1100,280000);if(mode==='demo'){privateDocs[type]={image};render();return toast(t('demoNote'))}const encrypted=await encryptedImage(image),url=await uploadImgBB(encrypted.png,'private-document');const record={url,key:encrypted.key,iv:encrypted.iv,length:encrypted.length,codec:'AES-GCM-RGB-v1',updatedAt:fb.f.serverTimestamp()};await fb.f.setDoc(fb.f.doc(fb.db,'profiles',uid,'documents',type),record);privateDocs[type]={...record,image};render();toast(t('saved'))})}
async function adminDocuments(id){if(role!=='admin'||mode!=='live')return;await act(async()=>{const snap=await fb.f.getDocs(fb.f.collection(fb.db,'profiles',id,'documents'));const items=[];for(const doc of snap.docs){items.push({id:doc.id,image:await decodeDocument(doc.data())})}modal(`<h2>${t('documents')}</h2><p class="private">${t('private')}</p>${items.map(d=>`<div class="docbox spaced"><label>${t(d.id==='iqama'?'docIqama':'docPassport')}</label><img style="max-width:100%" src="${e(d.image)}" alt="${t('preview')}"></div>`).join('')||`<p>${t('noDoc')}</p>`}`)})}
